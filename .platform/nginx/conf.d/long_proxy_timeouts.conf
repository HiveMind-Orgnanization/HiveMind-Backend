# Preview "Host" runs POST /api/missions/:id/preview/start synchronously (npm install + vite build).
# Default proxy read timeouts (~60s) cut the connection while Node is still building → 502 Bad Gateway
# in the browser (often shown as "internal error"). Raise timeouts for all proxied traffic to Node.
proxy_connect_timeout 900;
proxy_send_timeout 900;
proxy_read_timeout 900;
send_timeout 900;
